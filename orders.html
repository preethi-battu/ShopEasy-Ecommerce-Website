<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - ShopEasy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5 mb-5">

    <h1 class="mb-4">My Order History</h1>

    <div id="orderHistory"></div>

    <a href="index.html" class="btn btn-primary mt-3">
        Continue Shopping
    </a>

</div>

<script>
function displayOrders() {

    let orders = JSON.parse(localStorage.getItem("orders")) || [];

    let container = document.getElementById("orderHistory");

    if (orders.length === 0) {
        container.innerHTML = "<h5>No previous orders found.</h5>";
        return;
    }

    container.innerHTML = "";

    orders.slice().reverse().forEach(order => {

        let card = document.createElement("div");
        card.className = "card shadow-sm p-3 mb-3";

        let heading = document.createElement("h5");
        heading.textContent = "Order ID: " + order.orderId;

        let customer = document.createElement("p");
        customer.textContent = "Customer: " + order.name;

        let date = document.createElement("p");
        date.textContent = "Date: " + order.date;

        let total = document.createElement("h6");
        total.textContent = "Total Amount: ₹" + order.total;

        let products = document.createElement("div");
        products.textContent = "Products: " +
            order.items.map(item =>
                item.name + " × " + item.quantity
            ).join(", ");

        card.append(heading, customer, date, products, total);

        container.appendChild(card);
    });
}

displayOrders();
</script>

</body>
</html>
