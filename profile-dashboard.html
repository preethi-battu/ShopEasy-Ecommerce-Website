

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Dashboard - ShopEasy</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">My Profile Dashboard</h2>

    <div class="card p-4 mx-auto" style="max-width: 500px;">
        <h4>Customer Details</h4>

        <p><strong>Name:</strong> <span id="dashName">-</span></p>
        <p><strong>Email:</strong> <span id="dashEmail">-</span></p>
        <p><strong>Phone:</strong> <span id="dashPhone">-</span></p>
        <p><strong>Address:</strong> <span id="dashAddress">-</span></p>

        <a href="profile.html" class="btn btn-primary mt-3">
            Edit Profile
        </a>

        <a href="../index.html" class="btn btn-outline-secondary mt-2">
            Back to Home
        </a>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
