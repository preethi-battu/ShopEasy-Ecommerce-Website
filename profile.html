
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - ShopEasy</title>
    <link rel="stylesheet" href="../style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">My Profile</h2>

    <div class="card p-4 mx-auto" style="max-width: 500px;">
        <form id="profileForm">
            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="profileName" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="profileEmail" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="tel" id="profilePhone" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea id="profileAddress" class="form-control" rows="3"></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Save Profile
            </button>
            <button type="button" class="btn btn-danger w-100 mt-2" onclick="clearProfile()">
                 Clear Profile
            </button>
        </form>

        <p id="profileMessage" class="text-success text-center mt-3"></p>

        <a href="../index.html" class="btn btn-outline-secondary mt-2">
            Back to Home
        </a>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
