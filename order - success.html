```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Successful - ShopEasy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5 mb-5">

    <div class="card shadow p-4 mx-auto" style="max-width: 650px;">

        <div class="text-center">
            <h1 class="text-success">✓ Order Placed!</h1>
            <h4>Thank you for shopping with ShopEasy!</h4>
            <p>Your order has been confirmed successfully.</p>
        </div>

        <hr>

        <h4>Order Details</h4>

        <p><strong>Order ID:</strong> <span id="orderId"></span></p>
        <p><strong>Customer Name:</strong> <span id="customerName"></span></p>
        <p><strong>Phone:</strong> <span id="phone"></span></p>
        <p><strong>Address:</strong> <span id="address"></span></p>
        <p><strong>City:</strong> <span id="city"></span></p>
        <p><strong>PIN Code:</strong> <span id="pincode"></span></p>

        <hr>

        <h4>Ordered Products</h4>
        <div id="orderedItems"></div>

        <hr>

        <h4 class="text-success" id="orderTotal"></h4>

        <p><strong>Payment Method:</strong> Cash on Delivery</p>

        <div class="text-center mt-4">
            <a href="index.html" class="btn btn-primary">
                Continue Shopping
            </a>
        </div>

    </div>

</div>

<script>
    let order = JSON.parse(localStorage.getItem("lastOrder"));

    if (!order) {
        document.querySelector(".card").innerHTML =
            "<h3>No order details found.</h3><a href='index.html'>Go Home</a>";
    } else {

        let orderId = order.orderId || "SE" + Date.now();

        order.orderId = orderId;
        localStorage.setItem("lastOrder", JSON.stringify(order));

        document.getElementById("orderId").textContent = orderId;
        document.getElementById("customerName").textContent = order.name;
        document.getElementById("phone").textContent = order.phone;
        document.getElementById("address").textContent = order.address;
        document.getElementById("city").textContent = order.city;
        document.getElementById("pincode").textContent = order.pincode;

        let itemsContainer = document.getElementById("orderedItems");

        order.items.forEach(item => {
            let product = document.createElement("p");
            product.textContent =
                item.name + " × " + item.quantity +
                " = ₹" + (item.price * item.quantity);

            itemsContainer.appendChild(product);
        });

        document.getElementById("orderTotal").textContent =
            "Total Amount: ₹" + order.total;
    }
</script>

</body>
</html>
```
